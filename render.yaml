services:
  - type: web
    name: sparkos-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_IMAGE_MODEL
        value: gpt-image-1.5
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
    disk:
      name: sparkos-storage
      mountPath: /opt/render/project/src/backend/public
      sizeGB: 10

  - type: web
    name: sparkos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
